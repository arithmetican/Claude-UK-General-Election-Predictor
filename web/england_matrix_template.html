<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forecast Convergence</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  :root {
    color-scheme: dark;
    --bg: #1B2333; --text: #F2F4F8; --muted: #A9B1C2; --grid: #2C3547;
    --panel: #232C3E; --border: #3A4458;
    --uniform: #C9CFDB; --theta: #F28C38; --matrix: #4FD1A5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 40px; background: var(--bg); color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 16px; }
  .chart { position: relative; width: 100%; }
  svg { display: block; width: 100%; height: auto; overflow: visible; }
  .axis text { fill: var(--muted); font-size: 12px; }
  .axis path, .axis line { stroke: var(--border); }
  .grid line { stroke: var(--grid); }
  .grid path { display: none; }
  .axis-title { fill: var(--muted); font-size: 12px; }
  .line { fill: none; stroke-width: 2.25; stroke-linejoin: round; }
  .end-label { font-size: 12px; font-weight: 600; }
  .rule { stroke: var(--muted); stroke-width: 1; }
  .tooltip {
    position: absolute; pointer-events: none; background: var(--panel);
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
    font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,.5); display: none;
  }
  .tooltip h3 { margin: 0 0 2px; font-size: 13px; }
  .tooltip .seat { color: var(--muted); margin-bottom: 6px; }
  .tooltip table { border-collapse: collapse; }
  .tooltip td, .tooltip th { padding: 1px 0 1px 12px; text-align: right; font-variant-numeric: tabular-nums; }
  .tooltip td:first-child, .tooltip th:first-child { padding-left: 0; text-align: left; }
  .tooltip th { font-weight: 500; color: var(--muted); }
  .tooltip tr.err td { font-weight: 700; border-top: 1px solid var(--border); padding-top: 3px; }
  .swatch { display: inline-block; width: 10px; height: 3px; margin-right: 6px; vertical-align: middle; }
  .notes { color: var(--muted); font-size: 13px; margin-top: 14px; }
  .notes p { margin: 4px 0; }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p class="sub" id="subtitle"></p>
  <div class="chart" id="chart"><div class="tooltip" id="tooltip"></div></div>
  <div class="notes" id="notes"></div>
</main>
<script>
const RESULTS = /*RESULTS*/null;
const METHODS = [
  { key: "uniform", name: "Uniform swing", colour: "var(--uniform)" },
  { key: "theta", name: "Theta", colour: "var(--theta)" },
  { key: "matrix", name: "Transition matrix", colour: "var(--matrix)" },
];
const NAMES = { Lab: "Labour", Con: "Conservative", LibDem: "Lib Dem", Reform: "Reform",
  Green: "Green", Independent: "Independent", Others: "Others" };

// Total seat error: how many seats would have to move between parties to
// turn the forecast into the final result.
const seatError = (seats, fin) =>
  Object.keys(fin).reduce((t, p) => t + Math.abs((seats[p] || 0) - fin[p]), 0) / 2;

function draw() {
  const R = RESULTS, steps = R.steps, fin = R.final, E = R.england_seats;
  document.getElementById("title").textContent = R.title;
  document.getElementById("subtitle").textContent =
    `How far each method's forecast of England's ${E} seats is from the final result, ` +
    `after each English declaration. Starts at n = ${R.start}, once the transition matrix is well determined.`;

  steps.forEach(s => { s.err = {}; METHODS.forEach(m => s.err[m.key] = seatError(s.seats[m.key], fin)); });

  const W = 1000, H = 520, m = { top: 16, right: 150, bottom: 48, left: 56 };
  const iw = W - m.left - m.right, ih = H - m.top - m.bottom;
  const x = d3.scaleLinear().domain([R.start, E]).range([0, iw]);
  const y = d3.scaleLinear().domain([0, d3.max(steps, s => d3.max(METHODS, k => s.err[k.key]))]).nice().range([ih, 0]);

  const svg = d3.select("#chart").append("svg").attr("viewBox", `0 0 ${W} ${H}`)
    .attr("role", "img").attr("aria-label", "Seat error of three forecasting methods against declarations");
  const g = svg.append("g").attr("transform", `translate(${m.left},${m.top})`);
  g.append("g").attr("class", "grid").call(d3.axisLeft(y).ticks(8).tickSize(-iw).tickFormat(""));
  g.append("g").attr("class", "grid").attr("transform", `translate(0,${ih})`)
    .call(d3.axisBottom(x).ticks(10).tickSize(-ih).tickFormat(""));
  g.append("g").attr("class", "axis").attr("transform", `translate(0,${ih})`).call(d3.axisBottom(x).ticks(10));
  g.append("g").attr("class", "axis").call(d3.axisLeft(y).ticks(8));
  g.append("text").attr("class", "axis-title").attr("x", iw / 2).attr("y", ih + 40)
    .attr("text-anchor", "middle").text("English seats declared (n)");
  g.append("text").attr("class", "axis-title").attr("transform", "rotate(-90)")
    .attr("x", -ih / 2).attr("y", -42).attr("text-anchor", "middle").text("Total seat error");

  METHODS.forEach(k => {
    g.append("path").attr("class", "line").attr("stroke", k.colour)
      .attr("d", d3.line().x(s => x(s.n)).y(s => y(s.err[k.key]))(steps));
  });
  // Labels near the start of each line, where they are furthest apart.
  const first = steps[0];
  const labels = METHODS.map(k => ({ k, y: y(first.err[k.key]) })).sort((a, b) => a.y - b.y);
  for (let i = 1; i < labels.length; i++) labels[i].y = Math.max(labels[i].y, labels[i - 1].y + 16);
  g.selectAll(".end-label").data(labels).join("text").attr("class", "end-label")
    .attr("x", 6).attr("y", d => d.y).attr("dy", -6)
    .attr("fill", d => d.k.colour).text(d => d.k.name);

  const rule = g.append("line").attr("class", "rule").attr("y1", 0).attr("y2", ih).style("display", "none");
  const tip = document.getElementById("tooltip"), chart = document.getElementById("chart");
  const parties = Object.keys(fin);
  g.append("rect").attr("width", iw).attr("height", ih).attr("fill", "transparent")
    .on("pointermove", event => {
      const [mx] = d3.pointer(event);
      const s = steps[Math.max(0, Math.min(steps.length - 1, Math.round(x.invert(mx)) - steps[0].n))];
      rule.style("display", null).attr("x1", x(s.n)).attr("x2", x(s.n));
      const rows = parties.filter(p => fin[p] || METHODS.some(k => s.seats[k.key][p])).map(p =>
        `<tr><td>${NAMES[p] || p}</td>${METHODS.map(k => `<td>${s.seats[k.key][p] || 0}</td>`).join("")}<td>${fin[p]}</td></tr>`).join("");
      tip.innerHTML = `<h3>After ${s.n} English declarations</h3><div class="seat">${s.seat}: ${NAMES[s.winner] || s.winner}</div>` +
        `<table><tr><th>Forecast</th>${METHODS.map(k => `<th><span class="swatch" style="background:${k.colour}"></span>${k.name.split(" ")[0]}</th>`).join("")}<th>Final</th></tr>` +
        rows + `<tr class="err"><td>Seat error</td>${METHODS.map(k => `<td>${s.err[k.key]}</td>`).join("")}<td>0</td></tr></table>`;
      tip.style.display = "block";
      const box = chart.getBoundingClientRect(), scale = box.width / W, px = (m.left + x(s.n)) * scale;
      tip.style.left = `${px + 16 + tip.offsetWidth > box.width ? px - 16 - tip.offsetWidth : px + 16}px`;
      tip.style.top = `${m.top * scale}px`;
    })
    .on("pointerleave", () => { rule.style("display", "none"); tip.style.display = "none"; });

  document.getElementById("notes").innerHTML =
    `<p>Seat error: the number of seats that would have to change party to turn the forecast into the final result (half the sum of each party's difference). Each forecast is actual winners in declared English seats plus predicted winners in the rest.</p>` +
    `<p>Only English seats are used, both to measure change and to forecast. Transition matrix: T<sub>ab</sub> is the fraction of party a's 2019 voters now voting for party b; it is refitted from scratch after each declaration (convex least squares, entries ≥ 0, rows summing to 1), so it depends only on the seats declared so far.</p>` +
    `<p>Baseline: ${R.baseline}. Results: ${R.live}.</p>`;
}

if (!RESULTS) {
  document.getElementById("title").textContent = "No results yet";
  document.getElementById("subtitle").textContent = "Run: python -m predictor.matrix_replay";
} else if (typeof d3 === "undefined") {
  document.getElementById("title").textContent = "Could not load D3";
  document.getElementById("subtitle").textContent = "The graph needs an internet connection to load d3.js.";
} else {
  draw();
}
</script>
</body>
</html>
